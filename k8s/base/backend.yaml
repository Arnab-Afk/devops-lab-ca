apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-pull
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: chat-backend
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: chat-config }
            - secretRef: { name: chat-secrets }
          env:
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/chat
          # HPA percentages are calculated against these requests - without them the HPA cannot scale
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
