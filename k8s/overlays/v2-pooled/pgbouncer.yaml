apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: chat-config, key: POSTGRES_HOST }
            - name: DB_USER
              valueFrom:
                configMapKeyRef: { name: chat-config, key: DB_USER }
            - name: DB_NAME
              value: chat
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chat-secrets, key: POSTGRES_PASSWORD }
            - name: AUTH_TYPE
              value: scram-sha-256
            # Transaction pooling: thousands of client connections share a small set of real ones
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "2000"
            # Never more than 25 real connections to Postgres, however many backend pods exist
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: MAX_DB_CONNECTIONS
              value: "30"
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket: { port: 5432 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
